plugins { id 'com.android.application' }
android {
    namespace 'tr.net.gorkemcakir.sahadash'
    compileSdk 34
    defaultConfig {
        applicationId 'tr.net.gorkemcakir.sahadash'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
        // Site adresi: SSL kurulunca https://gorkemcakir.net.tr/ yapın
        buildConfigField 'String', 'BASE_URL', '"http://gorkemcakir.net.tr/"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
